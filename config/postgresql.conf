# Mounted read-only at /etc/postgresql/postgresql.conf for medivault-db and medivault-test.
# Everything not set here uses PostgreSQL's built-in defaults.
listen_addresses = '*'
hba_file = '/etc/postgresql/pg_hba.conf'
shared_preload_libraries = 'pgaudit'

# --- Transaction logs: WAL archived (encrypted) to Garage by pgBackRest -> PITR + incrementals
wal_level = replica
archive_mode = on                     # medivault-test overrides to off
archive_command = 'pgbackrest --stanza=medivault archive-push %p'
archive_timeout = 60                  # force a WAL segment switch at least every minute

# --- Error + access logs: own volume, shipped off-box then pruned by medivault_backup
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y%m%d_%H%M.log'
# log_rotation_age comes from LOG_ROTATION_MIN in .env (passed with -c in docker-compose.yml)
log_rotation_size = 0
log_file_mode = 0600
log_line_prefix = '%m [%p] %q%u@%d from %h '
log_connections = on                  # who, from where
log_disconnections = on               # + session duration
log_min_messages = warning
log_min_error_statement = error       # failed queries with their SQL text
log_lock_waits = on

# --- Audit logs: pgaudit (session audit of reads, writes, DDL, role changes)
pgaudit.log = 'read, write, ddl, role'
pgaudit.log_catalog = off
pgaudit.log_relation = on
pgaudit.log_parameter = off           # bind values may contain patient data
